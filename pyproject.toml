[project]
name = "deskink"
version = "0.1.0"
description = "Multi-page e-ink desk dashboard for a Raspberry Pi Zero 2 W and a Waveshare 2.13in e-Paper HAT V4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
deskink = "deskink.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deskink = ["assets/fonts/*", "fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
